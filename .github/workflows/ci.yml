name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: central-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: central-backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  test-pos-math:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
      - run: npm test

  build-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-apps/admin-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-apps/admin-portal/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_TENANT_ID: 00000000-0000-0000-0000-000000000001
          VITE_AUTH_TOKEN: ci

  build-storefront:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-apps/client-storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-apps/client-storefront/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:3000
          VITE_TENANT_ID: 00000000-0000-0000-0000-000000000001
          VITE_FACILITY_ID: 00000000-0000-0000-0000-000000000002
          VITE_TAX_RATE: "18"

  docker-api:
    runs-on: ubuntu-latest
    needs: [build-api]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mart-api:ci ./central-backend

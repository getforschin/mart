
services:
  postgres:
    image: postgres:15-alpine
    container_name: mart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mart_admin
      POSTGRES_PASSWORD: mart_secure_pass_2026
      POSTGRES_DB: mart_omnichannel
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./central-backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - mart_data_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mart_admin -d mart_omnichannel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: mart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mart_cache_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer:4
    container_name: mart-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - mart_data_network
      - mart_app_network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  mart_data_network:
    driver: bridge
    name: mart_data_network
  mart_cache_network:
    driver: bridge
    name: mart_cache_network
  mart_app_network:
    driver: bridge
    name: mart_app_network

volumes:
  postgres_data:
    name: mart_postgres_data
  redis_data:
    name: mart_redis_data

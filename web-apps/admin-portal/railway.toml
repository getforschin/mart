# Deploy Admin portal as a separate Railway service.
# Root Directory: / (repo root) OR set Dockerfile path below.

[build]
builder = "DOCKERFILE"
dockerfilePath = "web-apps/admin-portal/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
